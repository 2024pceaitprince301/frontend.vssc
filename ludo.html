<!DOCTYPE html>
<html>
<head>
    <title>Ludo Board</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin: 20px;
            color: #222;
        }

        .ludo {
            width: 600px;
            height: 600px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            border: 4px solid #222;
            background: white;
        }

        .cell {
            border: 1px solid #555;
        }

        /* =====================
           FOUR HOME AREAS
        ====================== */

        .red-area {
            grid-column: 1 / 7;
            grid-row: 1 / 7;
            background: #ef4444;
            padding: 25px;
        }

        .green-area {
            grid-column: 10 / 16;
            grid-row: 1 / 7;
            background: #22c55e;
            padding: 25px;
        }

        .blue-area {
            grid-column: 1 / 7;
            grid-row: 10 / 16;
            background: #3b82f6;
            padding: 25px;
        }

        .yellow-area {
            grid-column: 10 / 16;
            grid-row: 10 / 16;
            background: #facc15;
            padding: 25px;
        }

        .home-box {
            width: 100%;
            height: 100%;
            background: white;
            border: 3px solid #222;
            border-radius: 8px;

            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 15px;
            padding: 15px;
        }

        .token {
            border: 3px solid #222;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            margin: auto;
        }

        .red-token {
            background: #ef4444;
        }

        .green-token {
            background: #22c55e;
        }

        .blue-token {
            background: #3b82f6;
        }

        .yellow-token {
            background: #facc15;
        }


        /* =====================
           PATH
        ====================== */

        .path {
            background: white;
        }

        .red-path {
            background: #ef4444;
        }

        .green-path {
            background: #22c55e;
        }

        .blue-path {
            background: #3b82f6;
        }

        .yellow-path {
            background: #facc15;
        }

        .safe {
            background: #ddd;
        }


        /* =====================
           CENTER
        ====================== */

        .center {
            grid-column: 7 / 10;
            grid-row: 7 / 10;

            position: relative;
            overflow: hidden;

            background: conic-gradient(
                from 45deg,
                #22c55e 0deg 90deg,
                #facc15 90deg 180deg,
                #3b82f6 180deg 270deg,
                #ef4444 270deg 360deg
            );

            border: 2px solid #222;
        }

        .center::after {
            content: "★";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 35px;
            color: white;
            text-shadow: 0 0 4px black;
        }


        /* =====================
           TOP PATH
        ====================== */

        .top1  { grid-column: 7; grid-row: 1; }
        .top2  { grid-column: 8; grid-row: 1; }
        .top3  { grid-column: 9; grid-row: 1; }

        .top4  { grid-column: 7; grid-row: 2; }
        .top5  { grid-column: 8; grid-row: 2; }
        .top6  { grid-column: 9; grid-row: 2; }

        .top7  { grid-column: 7; grid-row: 3; }
        .top8  { grid-column: 8; grid-row: 3; }
        .top9  { grid-column: 9; grid-row: 3; }

        .top10 { grid-column: 7; grid-row: 4; }
        .top11 { grid-column: 8; grid-row: 4; }
        .top12 { grid-column: 9; grid-row: 4; }

        .top13 { grid-column: 7; grid-row: 5; }
        .top14 { grid-column: 8; grid-row: 5; }
        .top15 { grid-column: 9; grid-row: 5; }

        .top16 { grid-column: 7; grid-row: 6; }
        .top17 { grid-column: 8; grid-row: 6; }
        .top18 { grid-column: 9; grid-row: 6; }


        /* =====================
           BOTTOM PATH
        ====================== */

        .bottom1  { grid-column: 7; grid-row: 10; }
        .bottom2  { grid-column: 8; grid-row: 10; }
        .bottom3  { grid-column: 9; grid-row: 10; }

        .bottom4  { grid-column: 7; grid-row: 11; }
        .bottom5  { grid-column: 8; grid-row: 11; }
        .bottom6  { grid-column: 9; grid-row: 11; }

        .bottom7  { grid-column: 7; grid-row: 12; }
        .bottom8  { grid-column: 8; grid-row: 12; }
        .bottom9  { grid-column: 9; grid-row: 12; }

        .bottom10 { grid-column: 7; grid-row: 13; }
        .bottom11 { grid-column: 8; grid-row: 13; }
        .bottom12 { grid-column: 9; grid-row: 13; }

        .bottom13 { grid-column: 7; grid-row: 14; }
        .bottom14 { grid-column: 8; grid-row: 14; }
        .bottom15 { grid-column: 9; grid-row: 14; }

        .bottom16 { grid-column: 7; grid-row: 15; }
        .bottom17 { grid-column: 8; grid-row: 15; }
        .bottom18 { grid-column: 9; grid-row: 15; }


        /* =====================
           LEFT PATH
        ====================== */

        .left1  { grid-column: 1; grid-row: 7; }
        .left2  { grid-column: 2; grid-row: 7; }
        .left3  { grid-column: 3; grid-row: 7; }
        .left4  { grid-column: 4; grid-row: 7; }
        .left5  { grid-column: 5; grid-row: 7; }
        .left6  { grid-column: 6; grid-row: 7; }

        .left7  { grid-column: 1; grid-row: 8; }
        .left8  { grid-column: 2; grid-row: 8; }
        .left9  { grid-column: 3; grid-row: 8; }
        .left10 { grid-column: 4; grid-row: 8; }
        .left11 { grid-column: 5; grid-row: 8; }
        .left12 { grid-column: 6; grid-row: 8; }

        .left13 { grid-column: 1; grid-row: 9; }
        .left14 { grid-column: 2; grid-row: 9; }
        .left15 { grid-column: 3; grid-row: 9; }
        .left16 { grid-column: 4; grid-row: 9; }
        .left17 { grid-column: 5; grid-row: 9; }
        .left18 { grid-column: 6; grid-row: 9; }


        /* =====================
           RIGHT PATH
        ====================== */

        .right1  { grid-column: 10; grid-row: 7; }
        .right2  { grid-column: 11; grid-row: 7; }
        .right3  { grid-column: 12; grid-row: 7; }
        .right4  { grid-column: 13; grid-row: 7; }
        .right5  { grid-column: 14; grid-row: 7; }
        .right6  { grid-column: 15; grid-row: 7; }

        .right7  { grid-column: 10; grid-row: 8; }
        .right8  { grid-column: 11; grid-row: 8; }
        .right9  { grid-column: 12; grid-row: 8; }
        .right10 { grid-column: 13; grid-row: 8; }
        .right11 { grid-column: 14; grid-row: 8; }
        .right12 { grid-column: 15; grid-row: 8; }

        .right13 { grid-column: 10; grid-row: 9; }
        .right14 { grid-column: 11; grid-row: 9; }
        .right15 { grid-column: 12; grid-row: 9; }
        .right16 { grid-column: 13; grid-row: 9; }
        .right17 { grid-column: 14; grid-row: 9; }
        .right18 { grid-column: 15; grid-row: 9; }

    </style>
</head>

<body>

</html>
