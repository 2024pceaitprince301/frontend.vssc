<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 350px;
            text-align: center;
        }

        .login-box {
            background: white;
            border: 1px solid #dbdbdb;
            padding: 40px;
        }

        .logo {
            font-family: cursive;
            font-size: 42px;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            background: #fafafa;
            font-size: 12px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            background: #0095f6;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .or {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 25px 0;
            color: #737373;
            font-size: 13px;
        }

        .or::before,
        .or::after {
            content: "";
            height: 1px;
            background: #dbdbdb;
            flex: 1;
        }

        .facebook {
            color: #385185;
            font-weight: bold;
            font-size: 14px;
        }

        .forgot {
            display: block;
            margin-top: 20px;
            color: #00376b;
            font-size: 12px;
            text-decoration: none;
        }

        .signup {
            background: white;
            border: 1px solid #dbdbdb;
            margin-top: 10px;
            padding: 20px;
            font-size: 14px;
        }

        .signup a {
            color: #0095f6;
            font-weight: bold;
            text-decoration: none;
        }

        .app {
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="login-box">

            <div class="logo">Instagram</div>

            <input type="text" placeholder="Phone number, username, or email">

            <input type="password" placeholder="Password">

            <button>Log in</button>

            <div class="or">OR</div>

            <a href="facebook.html" class="facebook">Log in with Facebook</a>

            <a href="#" class="forgot">Forgot password?</a>

        </div>

        <div class="signup">
            Don't have an account?
            <a href="#">Sign up</a>
        </div>

        <div class="app">
            Get the app
        </div>

    </div>

</body>
</html>
